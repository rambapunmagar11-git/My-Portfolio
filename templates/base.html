<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{{ data.personal.name }} | Portfolio - B.Sc. CSIT, Mahendra College, Nepalgunj</title>
    <meta name="description" content="Personal portfolio of Ramba Pun Magar, a B.Sc. CSIT student at Mahendra College, Nepalgunj, Nepal. Web developer, Python & CS enthusiast.">
    <meta name="keywords" content="Ramba Pun Magar, BSc CSIT, Mahendra College Nepalgunj, Nepalgunj Nepal, Web Developer, Python, Portfolio">
    <meta name="author" content="Ramba Pun Magar">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Background Animated Blobs / Gradients -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <!-- Navigation Bar -->
    <header class="navbar" id="navbar">
        <div class="container nav-container">
            <a href="#home" class="nav-brand">
                <span class="brand-badge">RP</span>
                <span class="brand-text">My <span class="brand-accent">Portfolio</span></span>
            </a>

            <nav class="nav-menu" id="nav-menu">
                <ul class="nav-list">
                    <li class="nav-item"><a href="#home" class="nav-link active"><i class="fa-solid fa-house"></i> Home</a></li>
                    <li class="nav-item"><a href="#about" class="nav-link"><i class="fa-solid fa-user"></i> About</a></li>
                    <li class="nav-item"><a href="#skills" class="nav-link"><i class="fa-solid fa-layer-group"></i> Skills</a></li>
                    <li class="nav-item"><a href="#projects" class="nav-link"><i class="fa-solid fa-laptop-code"></i> Projects</a></li>
                    <li class="nav-item"><a href="#contact" class="nav-link"><i class="fa-solid fa-envelope"></i> Contact</a></li>
                </ul>

                <div class="nav-actions-mobile">
                    <a href="{{ url_for('download_cv') }}" class="btn btn-sm btn-outline">
                        <i class="fa-solid fa-download"></i> Resume
                    </a>
                </div>
            </nav>

            <div class="nav-actions">
                <!-- Theme Toggle Button -->
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Dark/Light Mode" title="Toggle theme">
                    <i class="fa-solid fa-moon moon-icon"></i>
                    <i class="fa-solid fa-sun sun-icon"></i>
                </button>

                <!-- Resume Download Button -->
                <a href="{{ url_for('download_cv') }}" class="btn btn-sm btn-outline desktop-only">
                    <i class="fa-solid fa-file-arrow-down"></i> Resume
                </a>

                <!-- Mobile Menu Toggle Button -->
                <button class="nav-toggle" id="nav-toggle" aria-label="Toggle Navigation Menu">
                    <span class="hamburger-bar"></span>
                    <span class="hamburger-bar"></span>
                    <span class="hamburger-bar"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Notification for Dynamic Alerts -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Back to Top Button -->
    <a href="#home" class="back-to-top" id="back-to-top" aria-label="Back to Top">
        <i class="fa-solid fa-arrow-up"></i>
    </a>

    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
